services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haseb}
      POSTGRES_USER: ${POSTGRES_USER:-haseb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisStrongPassword}
    volumes:
      - haseb_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haseb} -d ${POSTGRES_DB:-haseb}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-haseb};Username=${POSTGRES_USER:-haseb};Password=${POSTGRES_PASSWORD:-ChangeThisStrongPassword}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  haseb_db:
